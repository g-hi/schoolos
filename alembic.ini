# Alembic configuration for SchoolOS
# ─────────────────────────────────────────────────────────────────────────────
# Runtime table creation uses Base.metadata.create_all in the FastAPI lifespan
# (services/gateway/main.py).  Alembic is prepared here for future controlled
# migrations without changing the existing API contracts.
#
# Usage:
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#   alembic downgrade -1
#
# The DATABASE_URL env var overrides the sqlalchemy.url value below.

[alembic]
script_location = alembic
prepend_sys_path = .

# The database URL is read from the environment at runtime (see env.py).
# This placeholder value is never used when running inside Docker.
sqlalchemy.url = postgresql+asyncpg://schoolos_user:schoolos_pass@localhost:5432/schoolos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
